# Baagupadu Git Pre-Commit Security & Quality Hooks
# Run 'pip install pre-commit && pre-commit install' to enable locally

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-yaml
        exclude: '(frontend/.*|\.github/.*)'
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
