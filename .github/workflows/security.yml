name: DevSecOps & Code Security Audit

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Run Gitleaks (Open-Source CLI)
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --verbose --redact

  python-security:
    name: Backend SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r backend/requirements.txt

      - name: Run Bandit (Python Static Application Security Testing)
        run: |
          bandit -r backend/ -ll -x backend/tests/

      - name: Run Pip-Audit (Dependency Vulnerability Audit)
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln CVE-2024-0000 || true

      - name: Run Backend Pytest Suite (Security, Guardrails, Models, Endpoints)
        run: |
          pytest backend/tests/ -v

  frontend-security:
    name: Frontend Code, Security & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Frontend Vitest Suite (Stores & Streams)
        run: npm run test

      - name: Run npm Audit
        run: npm audit --audit-level=high || true
